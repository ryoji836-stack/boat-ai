<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOAT AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: #ffffff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

header {
  background: #111a33;
  border-bottom: 1px solid #26345c;
  padding: 22px 18px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #aab6d3;
  font-size: 14px;
}

main {
  max-width: 700px;
  margin: 0 auto;
  padding: 18px;
}

.card {
  background: #121a31;
  border: 1px solid #26345c;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #aab6d3;
  font-size: 13px;
}

select,
button {
  width: 100%;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
}

select {
  background: #0b1020;
  color: white;
  border: 1px solid #34446f;
}

button {
  margin-top: 16px;
  border: 0;
  background: #ffffff;
  color: #0b1020;
  font-weight: 700;
}

button:active {
  transform: scale(0.98);
}

.result {
  display: none;
}

.title {
  color: #aab6d3;
  font-size: 13px;
}

.main-boat {
  font-size: 38px;
  font-weight: 800;
  margin: 6px 0 16px;
}

.trifecta {
  font-size: 25px;
  font-weight: 700;
  margin: 8px 0;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.info {
  background: #0b1020;
  border-radius: 12px;
  padding: 14px;
}

.info small {
  display: block;
  color: #8d9aba;
  margin-bottom: 5px;
}

.info strong {
  font-size: 18px;
}

.boat-list {
  margin-top: 12px;
}

.boat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0b1020;
  border-radius: 10px;
  padding: 12px;
  margin-top: 7px;
}

.boat-name {
  font-weight: 700;
}

.score {
  color: #cbd5f1;
}

.badge {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 999px;
  background: #26345c;
  font-weight: 700;
}

.note {
  color: #8d9aba;
  font-size: 12px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: #697694;
  font-size: 12px;
  padding: 20px 0 40px;
}
</style>
</head>

<body>

<header>
  <h1>BOAT AI</h1>
  <p>競艇AI予想システム</p>
</header>

<main>

  <div class="card">

    <label for="stadium">競艇場</label>

    <select id="stadium">
      <option value="">競艇場を選択</option>
      <option value="01">桐生</option>
      <option value="02">戸田</option>
      <option value="03">江戸川</option>
      <option value="04">平和島</option>
      <option value="05">多摩川</option>
      <option value="06">浜名湖</option>
      <option value="07">蒲郡</option>
      <option value="08">常滑</option>
      <option value="09">津</option>
      <option value="10">三国</option>
      <option value="11">びわこ</option>
      <option value="12">住之江</option>
      <option value="13">尼崎</option>
      <option value="14">鳴門</option>
      <option value="15">丸亀</option>
      <option value="16">児島</option>
      <option value="17">宮島</option>
      <option value="18">徳山</option>
      <option value="19">下関</option>
      <option value="20">若松</option>
      <option value="21">芦屋</option>
      <option value="22">福岡</option>
      <option value="23">唐津</option>
      <option value="24">大村</option>
    </select>

    <br><br>

    <label for="race">レース</label>

    <select id="race">
      <option value="">レースを選択</option>
    </select>

    <button onclick="showPrediction()">
      AI予想を見る
    </button>

  </div>


  <div id="result" class="result">

    <div class="card">

      <div class="title">AI本命</div>

      <div id="mainBoat" class="main-boat">
        -
      </div>

      <div id="confidence" class="badge">
        -
      </div>

      <div class="info-grid">

        <div class="info">
          <small>スコア差</small>
          <strong id="gap">-</strong>
        </div>

        <div class="info">
          <small>AI判定</small>
          <strong id="judgement">-</strong>
        </div>

      </div>

    </div>


    <div class="card">

      <div class="title">
        3連単AI予想
      </div>

      <div id="trifecta" class="trifecta">
        -
      </div>

    </div>


    <div class="card">

      <div class="title">
        AIランキング
      </div>

      <div id="boatList" class="boat-list">
      </div>

    </div>


    <div class="card">

      <div class="title">
        AIについて
      </div>

      <p class="note">
        BOAT AIは公開されている競艇データを利用し、
        各艇のデータから独自のスコアを計算して予想順位を表示します。
      </p>

      <p class="note">
        AI予想は将来の結果や利益を保証するものではありません。
      </p>

    </div>

  </div>

  <div class="footer">
    BOAT AI
  </div>

</main>


<script>

/* ==========================================
   サンプルレースデータ
   ========================================== */

const raceData = {

  "07": {

    "1": [
      [1, 78.5],
      [2, 61.2],
      [3, 55.8],
      [4, 49.7],
      [5, 43.5],
      [6, 36.2]
    ],

    "2": [
      [1, 65.2],
      [2, 72.4],
      [3, 58.1],
      [4, 51.4],
      [5, 45.3],
      [6, 39.7]
    ],

    "3": [
      [1, 70.4],
      [2, 66.3],
      [3, 60.2],
      [4, 52.8],
      [5, 43.6],
      [6, 37.5]
    ],

    "4": [
      [1, 68.1],
      [2, 64.2],
      [3, 57.4],
      [4, 54.6],
      [5, 45.2],
      [6, 38.1]
    ],

    "5": [
      [1, 73.2],
      [2, 59.8],
      [3, 57.7],
      [4, 50.4],
      [5, 44.1],
      [6, 35.8]
    ],

    "6": [
      [1, 76.3],
      [2, 63.4],
      [3, 56.7],
      [4, 48.9],
      [5, 42.3],
      [6, 34.6]
    ]

  }

};


/* ==========================================
   レース選択
   ========================================== */

const raceSelect = document.getElementById("race");

for (let i = 1; i <= 12; i++) {

  const option = document.createElement("option");

  option.value = String(i);

  option.textContent = `${i}R`;

  raceSelect.appendChild(option);

}


/* ==========================================
   AI予想
   ========================================== */

function showPrediction() {

  const stadium =
    document.getElementById("stadium").value;

  const race =
    document.getElementById("race").value;

  if (!stadium || !race) {

    alert("競艇場とレースを選択してください。");

    return;
  }


  /*
   * 現段階では表示テスト用データ。
   * 次の工程でAPIの実データと接続する。
   */

  let data;

  if (
    raceData[stadium] &&
    raceData[stadium][race]
  ) {

    data = raceData[stadium][race];

  } else {

    data = [
      [1, 70],
      [2, 62],
      [3, 57],
      [4, 51],
      [5, 45],
      [6, 39]
    ];

  }


  const ranking =
    data
      .map(item => ({
        boat: item[0],
        score: item[1]
      }))
      .sort(
        (a, b) => b.score - a.score
      );


  const gap =
    ranking[0].score -
    ranking[1].score;


  let confidence;

  if (gap >= 30) {

    confidence = "高";

  } else if (gap >= 20) {

    confidence = "中";

  } else if (gap >= 10) {

    confidence = "低";

  } else {

    confidence = "見送り";

  }


  const recommended =
    gap >= 20;


  /* 本命 */

  document.getElementById(
    "mainBoat"
  ).textContent =
    `${ranking[0].boat}号艇`;


  /* 信頼度 */

  document.getElementById(
    "confidence"
  ).textContent =
    `信頼度：${confidence}`;


  /* スコア差 */

  document.getElementById(
    "gap"
  ).textContent =
    gap.toFixed(1);


  /* 判定 */

  document.getElementById(
    "judgement"
  ).textContent =
    recommended
      ? "推奨候補"
      : "見送り";


  /* 3連単 */

  document.getElementById(
    "trifecta"
  ).textContent =
    `${ranking[0].boat} → ${ranking[1].boat} → ${ranking[2].boat}`;


  /* ランキング */

  const list =
    document.getElementById(
      "boatList"
    );

  list.innerHTML = "";


  ranking.forEach(
    (boat, index) => {

      const div =
        document.createElement(
          "div"
        );

      div.className = "boat";

      div.innerHTML = `
        <div class="boat-name">
          ${index + 1}位　${boat.boat}号艇
        </div>

        <div class="score">
          ${boat.score.toFixed(1)}
        </div>
      `;

      list.appendChild(div);

    }
  );


  /* 結果表示 */

  document.getElementById(
    "result"
  ).style.display =
    "block";


  window.scrollTo({
    top: document.getElementById(
      "result"
    ).offsetTop - 10,
    behavior: "smooth"
  });

}

</script>

</body>
</html>
