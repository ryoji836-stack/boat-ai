<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOAT AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: #fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

header {
  background: #111a33;
  border-bottom: 1px solid #26345c;
  padding: 22px 18px;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 6px 0 0;
  color: #aab6d3;
  font-size: 14px;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 18px;
}

.card {
  background: #121a31;
  border: 1px solid #26345c;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #aab6d3;
  font-size: 13px;
}

select,
button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
}

select {
  background: #0b1020;
  color: white;
  border: 1px solid #34446f;
}

button {
  margin-top: 16px;
  border: none;
  background: white;
  color: #0b1020;
  font-weight: 700;
}

.status {
  margin-top: 12px;
  color: #aab6d3;
  font-size: 13px;
}

.result {
  display: none;
}

.title {
  color: #aab6d3;
  font-size: 13px;
}

.main-boat {
  font-size: 40px;
  font-weight: 800;
  margin: 6px 0 14px;
}

.badge {
  display: inline-block;
  padding: 7px 12px;
  border-radius: 999px;
  background: #26345c;
  font-weight: 700;
}

.trifecta {
  font-size: 26px;
  font-weight: 800;
  margin-top: 8px;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.info {
  background: #0b1020;
  border-radius: 12px;
  padding: 14px;
}

.info small {
  display: block;
  color: #8d9aba;
  margin-bottom: 5px;
}

.info strong {
  font-size: 18px;
}

.boat {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0b1020;
  border-radius: 10px;
  padding: 13px;
  margin-top: 7px;
}

.boat-name {
  font-weight: 700;
}

.score {
  color: #cbd5f1;
}

.data-box {
  margin-top: 14px;
  background: #0b1020;
  border-radius: 12px;
  padding: 14px;
}

.data-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 14px;
}

.note {
  color: #8d9aba;
  font-size: 12px;
  line-height: 1.6;
}

.footer {
  text-align: center;
  color: #697694;
  font-size: 12px;
  padding: 20px 0 40px;
}
</style>
</head>

<body>

<header>
  <h1>BOAT AI</h1>
  <p>競艇AI予想システム</p>
</header>

<main>

  <div class="card">

    <label for="stadium">
      競艇場
    </label>

    <select id="stadium">
      <option value="">
        データ取得中...
      </option>
    </select>

    <br><br>

    <label for="race">
      レース
    </label>

    <select id="race">
      <option value="">
        競艇場を選択してください
      </option>
    </select>

    <button id="predictButton">
      AI予想を見る
    </button>

    <div id="status" class="status">
      今日のデータを取得しています...
    </div>

  </div>


  <div id="result" class="result">

    <div class="card">

      <div class="title">
        AI本命
      </div>

      <div id="mainBoat" class="main-boat">
        -
      </div>

      <div id="confidence" class="badge">
        -
      </div>

      <div class="info-grid">

        <div class="info">
          <small>
            スコア差
          </small>

          <strong id="gap">
            -
          </strong>
        </div>

        <div class="info">
          <small>
            AI判定
          </small>

          <strong id="judgement">
            -
          </strong>
        </div>

      </div>

    </div>


    <div class="card">

      <div class="title">
        3連単AI予想
      </div>

      <div id="trifecta" class="trifecta">
        -
      </div>

    </div>


    <div class="card">

      <div class="title">
        AIランキング
      </div>

      <div id="boatList">
      </div>

    </div>


    <div class="card">

      <div class="title">
        詳細データ
      </div>

      <div id="detailData">
      </div>

    </div>


    <div class="card">

      <div class="title">
        BOAT AIについて
      </div>

      <p class="note">
        公開されている競艇データを利用し、
        各艇のデータからAIスコアを計算して
        予想順位を表示します。
      </p>

      <p class="note">
        AI予想は将来の結果や利益を保証するものではありません。
      </p>

    </div>

  </div>


  <div class="footer">
    BOAT AI
  </div>

</main>


<script>

/* ==========================================
   API
========================================== */

const API_URL =
  "https://boatraceopenapi.github.io/api/v1/today.json";


let todayData = null;


/* ==========================================
   AI係数
========================================== */

const NATIONAL_WEIGHT = 8.804;

const LOCAL_WEIGHT = 4.059;

const MOTOR_WEIGHT = 0.417;

const ST_WEIGHT = 117.952;

const LANE1_BONUS = 25.603;


/* ==========================================
   要素
========================================== */

const stadiumSelect =
  document.getElementById("stadium");

const raceSelect =
  document.getElementById("race");

const statusElement =
  document.getElementById("status");

const resultElement =
  document.getElementById("result");


/* ==========================================
   AIスコア
========================================== */

function calculateScore(boat) {

  let score = 0;

  score +=
    (Number(boat.national_win_rate) || 0)
    * NATIONAL_WEIGHT;

  score +=
    (Number(boat.local_win_rate) || 0)
    * LOCAL_WEIGHT;

  score +=
    (Number(boat.motor_top_2_percent) || 0)
    * MOTOR_WEIGHT;


  const st =
    Number(boat.average_start_timing);


  score +=
    (
      0.20 -
      (
        Number.isFinite(st)
          ? st
          : 0.20
      )
    )
    * ST_WEIGHT;


  if (
    Number(boat.entry_number) === 1
  ) {

    score += LANE1_BONUS;

  }


  return score;
}


/* ==========================================
   信頼度
========================================== */

function getConfidence(gap) {

  if (gap >= 30) {

    return "高";

  }

  if (gap >= 20) {

    return "中";

  }

  if (gap >= 10) {

    return "低";

  }

  return "見送り";
}


/* ==========================================
   APIデータ取得
========================================== */

async function loadData() {

  statusElement.textContent =
    "今日のデータを取得しています...";


  try {

    const response =
      await fetch(API_URL, {
        cache: "no-store"
      });


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    todayData =
      await response.json();


    const stadiums =
      todayData
        ?.programs
        ?.stadiums;


    if (!stadiums) {

      throw new Error(
        "競艇場データがありません"
      );

    }


    setupStadiums();


    statusElement.textContent =
      "今日のデータ取得完了";


  } catch (error) {

    console.error(error);


    statusElement.textContent =
      "データ取得に失敗しました";


    alert(
      "今日のデータを取得できませんでした。\n\n" +
      "ブラウザからAPIへ接続できない可能性があります。"
    );

  }

}


/* ==========================================
   競艇場セット
========================================== */

function setupStadiums() {

  const stadiums =
    todayData
      ?.programs
      ?.stadiums || {};


  stadiumSelect.innerHTML =
    '<option value="">競艇場を選択</option>';


  Object.entries(stadiums)
    .forEach(
      ([number, stadium]) => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          number;


        option.textContent =
          stadium.name
            ? stadium.name
            : `競艇場 ${number}`;


        stadiumSelect.appendChild(
          option
        );

      }
    );

}


/* ==========================================
   レースセット
========================================== */

function setupRaces() {

  raceSelect.innerHTML =
    '<option value="">レースを選択</option>';


  const stadiumNumber =
    stadiumSelect.value;


  if (!stadiumNumber) {

    return;

  }


  const stadium =
    todayData
      ?.programs
      ?.stadiums
      ?.[stadiumNumber];


  const races =
    stadium?.races || {};


  Object.keys(races)
    .sort(
      (a, b) =>
        Number(a) -
        Number(b)
    )
    .forEach(
      raceNumber => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          raceNumber;


        option.textContent =
          `${raceNumber}R`;


        raceSelect.appendChild(
          option
        );

      }
    );

}


/* ==========================================
   AI予想
========================================== */

function showPrediction() {

  const stadiumNumber =
    stadiumSelect.value;


  const raceNumber =
    raceSelect.value;


  if (!stadiumNumber) {

    alert(
      "競艇場を選択してください。"
    );

    return;

  }


  if (!raceNumber) {

    alert(
      "レースを選択してください。"
    );

    return;

  }


  const stadium =
    todayData
      ?.programs
      ?.stadiums
      ?.[stadiumNumber];


  const race =
    stadium
      ?.races
      ?.[raceNumber];


  if (!race) {

    alert(
      "レースデータがありません。"
    );

    return;

  }


  const racers =
    race.racers || {};


  const boats =
    Object.entries(racers)
      .map(
        ([entryNumber, boat]) => {

          const item = {
            ...boat
          };


          item.entry_number =
            Number(entryNumber);


          item.score =
            calculateScore(item);


          return item;

        }
      );


  if (boats.length !== 6) {

    alert(
      "6艇分のデータが揃っていません。"
    );

    return;

  }


  const ranking =
    boats.sort(
      (a, b) =>
        b.score -
        a.score
    );


  const gap =
    ranking[0].score -
    ranking[1].score;


  const confidence =
    getConfidence(gap);


  const recommended =
    gap >= 20;


  /* ======================================
     本命
  ====================================== */

  document.getElementById(
    "mainBoat"
  ).textContent =
    `${ranking[0].entry_number}号艇`;


  /* ======================================
     信頼度
  ====================================== */

  document.getElementById(
    "confidence"
  ).textContent =
    `信頼度：${confidence}`;


  /* ======================================
     スコア差
  ====================================== */

  document.getElementById(
    "gap"
  ).textContent =
    gap.toFixed(2);


  /* ======================================
     判定
  ====================================== */

  document.getElementById(
    "judgement"
  ).textContent =
    recommended
      ? "推奨候補"
      : "見送り";


  /* ======================================
     3連単
  ====================================== */

  document.getElementById(
    "trifecta"
  ).textContent =
    `${ranking[0].entry_number}`
    + " → "
    + `${ranking[1].entry_number}`
    + " → "
    + `${ranking[2].entry_number}`;


  /* ======================================
     ランキング
  ====================================== */

  const list =
    document.getElementById(
      "boatList"
    );


  list.innerHTML = "";


  ranking.forEach(
    (boat, index) => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "boat";


      div.innerHTML = `
        <div class="boat-name">
          ${index + 1}位　
          ${boat.entry_number}号艇
        </div>

        <div class="score">
          ${boat.score.toFixed(2)}
        </div>
      `;


      list.appendChild(div);

    }
  );


  /* ======================================
     詳細データ
  ====================================== */

  const detail =
    document.getElementById(
      "detailData"
    );


  const main =
    ranking[0];


  detail.innerHTML = `

    <div class="data-row">
      <span>全国勝率</span>
      <strong>
        ${formatNumber(
          main.national_win_rate
        )}
      </strong>
    </div>

    <div class="data-row">
      <span>当地勝率</span>
      <strong>
        ${formatNumber(
          main.local_win_rate
        )}
      </strong>
    </div>

    <div class="data-row">
      <span>モーター2連率</span>
      <strong>
        ${formatNumber(
          main.motor_top_2_percent
        )}%
      </strong>
    </div>

    <div class="data-row">
      <span>平均ST</span>
      <strong>
        ${formatNumber(
          main.average_start_timing
        )}
      </strong>
    </div>

  `;


  /* ======================================
     表示
  ====================================== */

  resultElement.style.display =
    "block";


  window.scrollTo({

    top:
      resultElement.offsetTop - 10,

    behavior:
      "smooth"

  });

}


/* ==========================================
   数値表示
========================================== */

function formatNumber(value) {

  const number =
    Number(value);


  if (!Number.isFinite(number)) {

    return "-";

  }


  return number.toFixed(2);

}


/* ==========================================
   イベント
========================================== */

stadiumSelect.addEventListener(
  "change",
  setupRaces
);


document.getElementById(
  "predictButton"
).addEventListener(
  "click",
  showPrediction
);


/* ==========================================
   起動
========================================== */

loadData();

</script>

</body>
</html>
