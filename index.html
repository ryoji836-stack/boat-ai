<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>BOAT AI</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background: #080d1c;

  color: #ffffff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}

header {

  background: #101832;

  border-bottom:
    1px solid #26345c;

  padding: 20px;

  position: sticky;

  top: 0;

  z-index: 10;

}

.header-inner {

  max-width: 760px;

  margin: auto;

}

header h1 {

  margin: 0;

  font-size: 28px;

}

header p {

  margin:
    5px 0 0;

  color: #9eacce;

  font-size: 13px;

}

main {

  max-width: 760px;

  margin: auto;

  padding: 16px;

}

.card {

  background: #111a31;

  border:
    1px solid #26345c;

  border-radius: 16px;

  padding: 16px;

  margin-bottom: 14px;

}

.section-title {

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 14px;

}

label {

  display: block;

  color: #9eacce;

  font-size: 13px;

  margin-bottom: 7px;

}

select,
button {

  width: 100%;

  border-radius: 12px;

  padding: 13px;

  font-size: 16px;

}

select {

  background: #080d1c;

  color: #ffffff;

  border:
    1px solid #34446f;

}

button {

  margin-top: 10px;

  border: 0;

  background: #ffffff;

  color: #080d1c;

  font-weight: 800;

}

button:active {

  transform:
    scale(0.98);

}

.status {

  margin-top: 10px;

  color: #9eacce;

  font-size: 12px;

}

.refresh {

  margin-top: 8px;

  background: #1b2748;

  color: #ffffff;

}

.race-list {

  display: grid;

  gap: 10px;

}

.race-card {

  background: #0c1429;

  border:
    1px solid #26345c;

  border-radius: 14px;

  padding: 14px;

  cursor: pointer;

}

.race-card:hover {

  border-color:
    #6074ad;

}

.race-top {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

}

.race-number {

  font-size: 20px;

  font-weight: 800;

}

.badge {

  display: inline-block;

  padding:
    5px 9px;

  border-radius: 999px;

  background: #26345c;

  font-size: 12px;

  font-weight: 700;

}

.badge-high {

  background: #6b3b20;

}

.badge-mid {

  background: #344c7a;

}

.badge-low {

  background: #29344e;

}

.badge-skip {

  background: #222a3b;

  color: #9eacce;

}

.race-main {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  margin-top: 12px;

}

.main-label {

  color: #9eacce;

  font-size: 12px;

}

.main-number {

  font-size: 28px;

  font-weight: 900;

}

.trifecta {

  font-size: 17px;

  font-weight: 800;

}

.race-bottom {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

  margin-top: 12px;

}

.mini-box {

  background: #111a31;

  border-radius: 9px;

  padding: 9px;

}

.mini-box small {

  display: block;

  color: #8493b5;

  font-size: 11px;

}

.mini-box strong {

  font-size: 15px;

}

.detail {

  display: none;

}

.main-boat {

  font-size: 42px;

  font-weight: 900;

  margin:
    4px 0 12px;

}

.big-trifecta {

  font-size: 27px;

  font-weight: 900;

  margin-top: 8px;

}

.info-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin-top: 14px;

}

.info {

  background: #080d1c;

  border-radius: 10px;

  padding: 12px;

}

.info small {

  display: block;

  color: #8493b5;

  margin-bottom: 4px;

}

.info strong {

  font-size: 17px;

}

.boat-row {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  background: #080d1c;

  border-radius: 10px;

  padding: 11px;

  margin-top: 7px;

}

.boat-left {

  font-weight: 700;

}

.boat-right {

  text-align: right;

}

.boat-score {

  font-weight: 800;

}

.boat-data {

  color: #8493b5;

  font-size: 11px;

  margin-top: 3px;

}

.note {

  color: #8493b5;

  font-size: 12px;

  line-height: 1.7;

}

.empty {

  text-align: center;

  padding: 30px 10px;

  color: #8493b5;

}

.footer {

  text-align: center;

  color: #5d6a86;

  font-size: 11px;

  padding:
    20px 0 40px;

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<h1>BOAT AI</h1>

<p>
今日の競艇AI予想
</p>

</div>

</header>


<main>


<!-- ==============================
     選択
============================== -->

<div class="card">

<div class="section-title">
今日のAI予想
</div>


<label>
競艇場
</label>


<select id="stadium">

<option value="">
データ取得中...
</option>

</select>


<button
  id="refreshButton"
  class="refresh"
>
データを更新
</button>


<div
  id="status"
  class="status"
>
読み込み中...
</div>

</div>


<!-- ==============================
     全レース
============================== -->

<div class="card">

<div class="section-title">

<span id="stadiumTitle">
レース一覧
</span>

</div>


<div
  id="raceList"
  class="race-list"
>

<div class="empty">
競艇場を選択してください
</div>

</div>

</div>


<!-- ==============================
     詳細
============================== -->

<div
  id="detail"
  class="detail"
>


<div class="card">

<div class="section-title">
AI詳細予想
</div>


<div
  id="detailRace"
  class="main-label"
>
-
</div>


<div
  id="mainBoat"
  class="main-boat"
>
-
</div>


<div
  id="confidence"
  class="badge"
>
-
</div>


<div class="info-grid">


<div class="info">

<small>
スコア差
</small>

<strong id="gap">
-
</strong>

</div>


<div class="info">

<small>
AI判定
</small>

<strong id="judgement">
-
</strong>

</div>


</div>


</div>


<div class="card">

<div class="section-title">
3連単AI予想
</div>


<div
  id="trifecta"
  class="big-trifecta"
>
-
</div>

</div>


<div class="card">

<div class="section-title">
AIランキング
</div>


<div id="ranking">
</div>

</div>


</div>


<div class="card">

<p class="note">

BOAT AIは公開されている競艇データを利用し、
各艇のデータからAIスコアを計算して
予想順位を表示します。

</p>


<p class="note">

AI予想は将来の結果や利益を保証するものではありません。

</p>

</div>


<div class="footer">
BOAT AI
</div>


</main>


<script>


/* ==========================================
   API
========================================== */

const API_URL =
"https://boatraceopenapi.github.io/api/v1/today.json";


let todayData = null;


/* ==========================================
   AI係数
========================================== */

const NATIONAL_WEIGHT =
8.804;

const LOCAL_WEIGHT =
4.059;

const MOTOR_WEIGHT =
0.417;

const ST_WEIGHT =
117.952;

const LANE1_BONUS =
25.603;


/* ==========================================
   要素
========================================== */

const stadiumSelect =
document.getElementById(
"stadium"
);

const raceList =
document.getElementById(
"raceList"
);

const statusElement =
document.getElementById(
"status"
);

const detailElement =
document.getElementById(
"detail"
);


/* ==========================================
   AIスコア
========================================== */

function calculateScore(boat) {

let score = 0;


score +=
(Number(boat.national_win_rate) || 0)
* NATIONAL_WEIGHT;


score +=
(Number(boat.local_win_rate) || 0)
* LOCAL_WEIGHT;


score +=
(Number(boat.motor_top_2_percent) || 0)
* MOTOR_WEIGHT;


const st =
Number(
boat.average_start_timing
);


score +=
(
0.20 -
(
Number.isFinite(st)
? st
: 0.20
)
)
* ST_WEIGHT;


if (
Number(boat.entry_number) === 1
) {

score +=
LANE1_BONUS;

}


return score;

}


/* ==========================================
   信頼度
========================================== */

function getConfidence(gap) {

if (gap >= 30) {

return "高";

}

if (gap >= 20) {

return "中";

}

if (gap >= 10) {

return "低";

}

return "見送り";

}


/* ==========================================
   バッジ
========================================== */

function getBadgeClass(
confidence
) {

if (confidence === "高") {

return "badge-high";

}

if (confidence === "中") {

return "badge-mid";

}

if (confidence === "低") {

return "badge-low";

}

return "badge-skip";

}


/* ==========================================
   数値
========================================== */

function num(value) {

const n =
Number(value);

if (!Number.isFinite(n)) {

return "-";

}

return n.toFixed(2);

}


/* ==========================================
   レース解析
========================================== */

function analyzeRace(race) {

const racers =
race?.racers || {};


const boats =
Object.entries(racers)
.map(
([entryNumber, boat]) => {

const item = {
...boat
};

item.entry_number =
Number(entryNumber);

item.score =
calculateScore(item);

return item;

}
);


if (boats.length !== 6) {

return null;

}


const ranking =
boats.sort(
(a, b) =>
b.score -
a.score
);


const gap =
ranking[0].score -
ranking[1].score;


const confidence =
getConfidence(gap);


return {

ranking,

gap,

confidence,

recommended:
gap >= 20,

trifecta: [

ranking[0].entry_number,

ranking[1].entry_number,

ranking[2].entry_number

]

};

}


/* ==========================================
   API取得
========================================== */

async function loadData() {

statusElement.textContent =
"今日のデータを取得しています...";


try {

const response =
await fetch(
API_URL,
{
cache:
"no-store"
}
);


if (!response.ok) {

throw new Error(
"HTTP " +
response.status
);

}


todayData =
await response.json();


const stadiums =
todayData
?.programs
?.stadiums;


if (!stadiums) {

throw new Error(
"データがありません"
);

}


setupStadiums();


statusElement.textContent =
"データ取得完了";


}
catch(error) {

console.error(error);


statusElement.textContent =
"データ取得に失敗しました";


raceList.innerHTML = `

<div class="empty">

今日のデータを取得できませんでした。

</div>

`;

}

}


/* ==========================================
   競艇場
========================================== */

function setupStadiums() {

const stadiums =
todayData
?.programs
?.stadiums || {};


stadiumSelect.innerHTML =
`
<option value="">
競艇場を選択
</option>
`;


Object.entries(stadiums)
.forEach(
([number, stadium]) => {

const option =
document.createElement(
"option"
);


option.value =
number;


option.textContent =
stadium.name
||
`競艇場 ${number}`;


stadiumSelect.appendChild(
option
);

}
);


}


/* ==========================================
   全レース表示
========================================== */

function showRaces() {

const stadiumNumber =
stadiumSelect.value;


raceList.innerHTML = "";


detailElement.style.display =
"none";


if (!stadiumNumber) {

raceList.innerHTML = `

<div class="empty">

競艇場を選択してください

</div>

`;

return;

}


const stadium =
todayData
?.programs
?.stadiums
?.[stadiumNumber];


if (!stadium) {

return;

}


document.getElementById(
"stadiumTitle"
).textContent =
stadium.name
||
`競艇場 ${stadiumNumber}`;


const races =
stadium.races || {};


Object.keys(races)
.sort(
(a,b) =>
Number(a) -
Number(b)
)
.forEach(
raceNumber => {


const race =
races[raceNumber];


const analysis =
analyzeRace(race);


if (!analysis) {

return;

}


const card =
document.createElement(
"div"
);


card.className =
"race-card";


const badgeClass =
getBadgeClass(
analysis.confidence
);


const recommendedText =
analysis.recommended
? "推奨候補"
: "見送り";


card.innerHTML = `

<div class="race-top">

<div class="race-number">

${raceNumber}R

</div>

<div class="badge ${badgeClass}">

${analysis.confidence}

</div>

</div>


<div class="race-main">

<div>

<div class="main-label">
AI本命
</div>

<div class="main-number">

${analysis.ranking[0].entry_number}号艇

</div>

</div>


<div>

<div class="main-label">
3連単
</div>

<div class="trifecta">

${analysis.trifecta.join("→")}

</div>

</div>

</div>


<div class="race-bottom">


<div class="mini-box">

<small>
スコア差
</small>

<strong>
${analysis.gap.toFixed(1)}
</strong>

</div>


<div class="mini-box">

<small>
AI判定
</small>

<strong>
${recommendedText}
</strong>

</div>


</div>

`;


card.addEventListener(
"click",
() => {

showDetail(
stadium,
raceNumber,
analysis
);

}
);


raceList.appendChild(
card
);

}
);


if (
raceList.children.length === 0
) {

raceList.innerHTML = `

<div class="empty">

予想可能なレースがありません

</div>

`;

}

}


/* ==========================================
   詳細表示
========================================== */

function showDetail(
stadium,
raceNumber,
analysis
) {


detailElement.style.display =
"block";


document.getElementById(
"detailRace"
).textContent =
`${stadium.name || "競艇場"} ${raceNumber}R`;


document.getElementById(
"mainBoat"
).textContent =
`${analysis.ranking[0].entry_number}号艇`;


const confidence =
document.getElementById(
"confidence"
);


confidence.textContent =
`信頼度：${analysis.confidence}`;


confidence.className =
"badge " +
getBadgeClass(
analysis.confidence
);


document.getElementById(
"gap"
).textContent =
analysis.gap.toFixed(2);


document.getElementById(
"judgement"
).textContent =
analysis.recommended
? "推奨候補"
: "見送り";


document.getElementById(
"trifecta"
).textContent =
analysis.trifecta.join(" → ");


/* ======================================
   ランキング
====================================== */

const rankingElement =
document.getElementById(
"ranking"
);


rankingElement.innerHTML = "";


analysis.ranking.forEach(
(boat,index) => {


const row =
document.createElement(
"div"
);


row.className =
"boat-row";


row.innerHTML = `

<div class="boat-left">

${index + 1}位　
${boat.entry_number}号艇

</div>


<div class="boat-right">

<div class="boat-score">

${boat.score.toFixed(2)}

</div>


<div class="boat-data">

全国 ${num(boat.national_win_rate)}

　当地 ${num(boat.local_win_rate)}

</div>


<div class="boat-data">

モーター2連率
${num(boat.motor_top_2_percent)}%

　ST
${num(boat.average_start_timing)}

</div>

</div>

`;


rankingElement.appendChild(
row
);

}
);


window.scrollTo({

top:
detailElement.offsetTop - 10,

behavior:
"smooth"

});

}


/* ==========================================
   イベント
========================================== */

stadiumSelect.addEventListener(
"change",
showRaces
);


document.getElementById(
"refreshButton"
).addEventListener(
"click",
loadData
);


/* ==========================================
   起動
========================================== */

loadData();


</script>

</body>

</html>
