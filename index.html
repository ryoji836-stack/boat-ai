<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOAT AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      background: #111a33;
      border-bottom: 1px solid #26345c;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #aab6d3;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #121a31;
      border: 1px solid #26345c;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin-top: 0;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    select {
      background: #202b4a;
      color: white;
    }

    button {
      background: #2f7cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .prediction {
      display: none;
      margin-top: 20px;
    }

    .main-number {
      font-size: 52px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    .top3 {
      font-size: 24px;
      text-align: center;
      padding: 16px;
      background: #202b4a;
      border-radius: 12px;
    }

    .note {
      color: #8f9bb8;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #6f7b99;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚤 BOAT AI</h1>
  <p>競艇AI予想システム</p>
</header>

<main>

  <div class="card">
    <h2>今日のAI予想</h2>

    <label for="stadium">競艇場</label>

    <select id="stadium">
      <option>桐生</option>
      <option>戸田</option>
      <option>江戸川</option>
      <option>平和島</option>
      <option>多摩川</option>
      <option>浜名湖</option>
      <option>蒲郡</option>
      <option>常滑</option>
      <option>津</option>
      <option>三国</option>
      <option>びわこ</option>
      <option>住之江</option>
      <option>尼崎</option>
    </select>

    <label for="race">レース</label>

    <select id="race">
      <option>1R</option>
      <option>2R</option>
      <option>3R</option>
      <option>4R</option>
      <option>5R</option>
      <option>6R</option>
      <option>7R</option>
      <option>8R</option>
      <option>9R</option>
      <option>10R</option>
      <option>11R</option>
      <option>12R</option>
    </select>

    <button onclick="showPrediction()">
      AI予想を見る
    </button>

    <div id="prediction" class="prediction">

      <h2>AI予想</h2>

      <div class="main-number">
        🥇 1号艇
      </div>

      <div class="top3">
        AI上位3艇<br>
        1 → 3 → 2
      </div>

      <p class="note">
        ※現在はAIスコアモデルによる試作版です。<br>
        実際のレース結果や払戻を保証するものではありません。
      </p>

    </div>
  </div>

</main>

<footer>
  BOAT AI Prototype
</footer>

<script>
  function showPrediction() {
    document.getElementById("prediction").style.display = "block";
  }
</script>

</body>
</html>
