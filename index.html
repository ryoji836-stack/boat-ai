<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BOAT AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      background: #111a33;
      border-bottom: 1px solid #26345c;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #aab6d3;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: #121a31;
      border: 1px solid #26345c;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    select {
      background: #202b4a;
      color: white;
    }

    button {
      background: #2f7cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .prediction {
      display: none;
      margin-top: 20px;
    }

    .main-number {
      font-size: 52px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
    }

    .top3 {
      font-size: 24px;
      text-align: center;
      padding: 16px;
      background: #202b4a;
      border-radius: 12px;
    }

    .ranking {
      margin-top: 20px;
    }

    .boat {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      margin-top: 8px;
      background: #202b4a;
      border-radius: 10px;
    }

    .note {
      color: #8f9bb8;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 20px;
    }

    .status {
      margin-top: 15px;
      color: #aab6d3;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #6f7b99;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <h1>🚤 BOAT AI</h1>
  <p>競艇AI予想システム</p>
</header>

<main>

  <div class="card">

    <h2>今日のAI予想</h2>

    <label for="stadium">競艇場</label>
    <select id="stadium">
      <option value="">読み込み中...</option>
    </select>

    <label for="race">レース</label>
    <select id="race">
      <option value="">---</option>
    </select>

    <button id="predictButton" onclick="showPrediction()">
      AI予想を見る
    </button>

    <div id="status" class="status"></div>

    <div id="prediction" class="prediction">

      <h2>AI予想</h2>

      <div id="mainNumber" class="main-number">
        ---
      </div>

      <div id="top3" class="top3">
        AI上位3艇<br>
        ---
      </div>

      <div id="ranking" class="ranking"></div>

      <p class="note">
        ※AIスコアモデルによる試作版です。<br>
        実際のレース結果や払戻を保証するものではありません。
      </p>

    </div>

  </div>

</main>

<footer>
  BOAT AI Prototype
</footer>

<script>

const API_URL =
  "https://boatraceopenapi.github.io/api/v1/today.json";

const stadiumNames = {
  "01": "桐生",
  "02": "戸田",
  "03": "江戸川",
  "04": "平和島",
  "05": "多摩川",
  "06": "浜名湖",
  "07": "蒲郡",
  "08": "常滑",
  "09": "津",
  "10": "三国",
  "11": "びわこ",
  "12": "住之江",
  "13": "尼崎",
  "14": "鳴門",
  "15": "丸亀",
  "16": "児島",
  "17": "宮島",
  "18": "徳山",
  "19": "下関",
  "20": "若松",
  "21": "芦屋",
  "22": "福岡",
  "23": "唐津",
  "24": "大村"
};

let data = null;


/*
  BOAT AI 最適化スコア

  全国勝率        × 8.804
  当地勝率        × 4.059
  モーター2連対率 × 0.417
  平均ST          × 117.952
  1号艇ボーナス   + 25.603
*/

function calculateScore(boat) {

  let score = 0;

  // 全国勝率
  score +=
    (boat.national_win_rate || 0) * 8.804;

  // 当地勝率
  score +=
    (boat.local_win_rate || 0) * 4.059;

  // モーター2連対率
  score +=
    (boat.motor_top_2_percent || 0) * 0.417;

  // 平均スタートタイミング
  const st =
    boat.average_start_timing || 0.20;

  score +=
    (0.20 - st) * 117.952;

  // 1号艇ボーナス
  if (Number(boat.entry_number) === 1) {
    score += 25.603;
  }

  return score;
}


async function loadData() {

  const status =
    document.getElementById("status");

  try {

    status.textContent =
      "今日の競艇データを取得中...";

    const response =
      await fetch(API_URL);

    if (!response.ok) {
      throw new Error("データ取得に失敗しました");
    }

    data = await response.json();

    const stadiumSelect =
      document.getElementById("stadium");

    stadiumSelect.innerHTML = "";

    const stadiums =
      data.programs.stadiums;

    for (const stadiumNumber of Object.keys(stadiums)) {

      const option =
        document.createElement("option");

      const number =
        stadiumNumber.padStart(2, "0");

      option.value =
        stadiumNumber;

      option.textContent =
        stadiumNames[number] ||
        "競艇場 " + stadiumNumber;

      stadiumSelect.appendChild(option);
    }

    stadiumSelect.dispatchEvent(
      new Event("change")
    );

    status.textContent =
      "データ取得完了！";

  } catch (error) {

    console.error(error);

    status.textContent =
      "データ取得エラー: " +
      error.message;
  }
}


document
  .getElementById("stadium")
  .addEventListener("change", function() {

    if (!data) return;

    const stadiumNumber =
      this.value;

    const stadium =
      data.programs.stadiums[stadiumNumber];

    const raceSelect =
      document.getElementById("race");

    raceSelect.innerHTML = "";

    const races =
      stadium.races || {};

    for (const raceNumber of Object.keys(races)) {

      const option =
        document.createElement("option");

      option.value =
        raceNumber;

      option.textContent =
        raceNumber + "R";

      raceSelect.appendChild(option);
    }
  });


function showPrediction() {

  if (!data) {

    alert(
      "データを読み込み中です。少し待ってください。"
    );

    return;
  }

  const stadiumNumber =
    document.getElementById("stadium").value;

  const raceNumber =
    document.getElementById("race").value;

  const stadium =
    data.programs.stadiums[stadiumNumber];

  const race =
    stadium.races[raceNumber];

  if (!race) {

    alert(
      "レースデータがありません。"
    );

    return;
  }

  const racers =
    race.racers || {};

  const boats = [];

  for (const entryNumber in racers) {

    const boat =
      racers[entryNumber];

    boat.entry_number =
      Number(entryNumber);

    boat.score =
      calculateScore(boat);

    boats.push(boat);
  }

  if (boats.length === 0) {

    alert(
      "選択したレースの選手データがありません。"
    );

    return;
  }

  const ranking =
    boats.sort(
      (a, b) => b.score - a.score
    );

  const main =
    ranking[0].entry_number;

  const top3 =
    ranking
      .slice(0, 3)
      .map(
        boat => boat.entry_number
      )
      .join(" → ");

  document
    .getElementById("mainNumber")
    .textContent =
      "🥇 " + main + "号艇";

  document
    .getElementById("top3")
    .innerHTML =
      "AI上位3艇<br>" + top3;

  const rankingElement =
    document.getElementById("ranking");

  rankingElement.innerHTML =
    "<h3>AIスコア順位</h3>";

  ranking.forEach((boat, index) => {

    const div =
      document.createElement("div");

    div.className =
      "boat";

    div.innerHTML =
      "<span>" +
      (index + 1) +
      "位　" +
      boat.entry_number +
      "号艇</span>" +
      "<span>" +
      boat.score.toFixed(1) +
      "</span>";

    rankingElement.appendChild(div);
  });

  document
    .getElementById("prediction")
    .style.display =
      "block";
}


loadData();

</script>

</body>
</html>
